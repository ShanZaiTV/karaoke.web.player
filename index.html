<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Web Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎤 Karaoke Player</div>
    <div class="api-status" id="apiStatus">API key required</div>
  </header>

  <main class="app">
    <section class="player-card">
      <div id="player"></div>
      <div class="now-playing">
        <div>
          <span class="eyebrow">NOW PLAYING</span>
          <h1 id="nowTitle">Search for a karaoke song</h1>
          <p id="nowChannel">YouTube</p>
        </div>
        <button class="queue-btn" id="addCurrentBtn" disabled>＋ Add to Queue</button>
      </div>
    </section>

    <section class="search-card">
      <form id="searchForm">
        <input id="searchInput" type="search"
               placeholder="Search karaoke songs, e.g. Adele Easy On Me karaoke"
               autocomplete="off">
        <button type="submit">Search</button>
      </form>
    </section>

    <div class="content-grid">
      <section>
        <div class="section-title">
          <h2>Search Results</h2>
          <span id="resultCount"></span>
        </div>
        <div id="results" class="results">
          <div class="empty">Search YouTube for a karaoke track.</div>
        </div>
      </section>

      <aside class="queue-card">
        <div class="section-title">
          <h2>Queue</h2>
          <button id="clearQueueBtn" class="small-btn">Clear</button>
        </div>
        <div id="queue" class="queue">
          <div class="empty">Your queue is empty.</div>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    YouTube-powered karaoke player • Use only videos you are permitted to play/embed.
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
